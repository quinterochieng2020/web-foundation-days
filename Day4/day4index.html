<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Draft App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Note Draft</h1>
    
    <div class="controls">
      <button id="theme-toggle" type="button">Dark mode</button>
      <button id="clear-btn" type="button">Clear</button>
    </div>

    <div class="input-group">
      <label for="note-text">Your Note:</label>
      <textarea id="note-text" placeholder="Type your note here... (Press Escape to clear)"></textarea>
    </div>

    <div class="counters">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>
  </main>
</body>
</html>
